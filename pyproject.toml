[build-system]
requires = ["setuptools>=80", "wheel", "cffi>=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "z3950-search-for-marc"
version = "2.0.0"
description = "Self-contained desktop client for searching Z39.50 targets and exporting MARC records."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
authors = [{ name = "jspann" }]
dependencies = [
  "cffi>=2.0,<3",
  "cryptography>=45,<47",
  "jsonschema>=4.25,<5",
  "platformdirs>=4.4,<5",
  "pymarc>=5.4,<6",
  "PySide6>=6.10,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-qt>=4.5,<5",
  "ruff>=0.13,<1",
  "setuptools>=80,<81",
]
package = [
  "nuitka>=4.1,<5",
  "ordered-set>=4.1,<5",
  "zstandard>=0.24,<1",
]

[project.scripts]
z3950-search = "z3950_search_for_marc.__main__:main"
z3950-catalog-health = "z3950_search_for_marc.catalog_health:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
z3950_search_for_marc = [
  "resources/*.ico",
  "resources/*.json",
  "resources/*.pem",
  "resources/*.svg",
  "resources/*.txt",
  "native/*.dll",
  "native/*.pyd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["native: requires the compiled embedded YAZ adapter"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
