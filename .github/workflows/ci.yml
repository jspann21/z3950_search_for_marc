name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src tests
      - name: Test
        run: python -m pytest

  windows-package:
    name: Windows package
    runs-on: windows-latest
    needs: quality
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev,package]
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm main.spec
      - name: Launch smoke test
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/z3950_search_for_marc-1.0.0.exe" `
            -ArgumentList "--smoke-test" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          exit $process.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: z3950-search-for-marc-1.0.0-windows
          path: dist/z3950_search_for_marc-1.0.0.exe
          if-no-files-found: error
