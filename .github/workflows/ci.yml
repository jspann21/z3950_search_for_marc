name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python 3.14 · Windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14.3"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not native" --junitxml=test-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: test-results.xml

  native-windows:
    name: Embedded YAZ and Windows package
    runs-on: windows-latest
    needs: quality
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $VersionMatch = Select-String -LiteralPath pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"$'
          if (-not $VersionMatch) { throw "Could not read the application version from pyproject.toml." }
          "version=$($VersionMatch.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14.3"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra package
      - shell: pwsh
        run: ./scripts/build_yaz.ps1
      - run: uv run pytest -m native
      - shell: pwsh
        run: ./scripts/package_windows.ps1
      - shell: pwsh
        run: ./scripts/test_msi.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Z3950MarcSearch-${{ steps.package.outputs.version }}-Windows-x64
          path: |
            dist/Z3950MarcSearch-${{ steps.package.outputs.version }}-x64.msi
            dist/SHA256SUMS.txt
            dist/main.dist/**
          if-no-files-found: error

  release:
    name: Publish tagged GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: native-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        id: package
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: Z3950MarcSearch-${{ steps.package.outputs.version }}-Windows-x64
          path: release
      - name: Add release notices
        shell: bash
        run: |
          cp LICENSE release/LICENSE.txt
          cp src/z3950_search_for_marc/resources/YAZ-LICENSE.txt release/YAZ-LICENSE.txt
          cp src/z3950_search_for_marc/resources/THIRD-PARTY-NOTICES.txt release/THIRD-PARTY-NOTICES.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/Z3950MarcSearch-${{ steps.package.outputs.version }}-x64.msi"
          "release/SHA256SUMS.txt"
          "release/LICENSE.txt"
          "release/YAZ-LICENSE.txt"
          "release/THIRD-PARTY-NOTICES.txt"
          --verify-tag
          --generate-notes
          --title "Z39.50 MARC Search ${{ steps.package.outputs.version }}"
