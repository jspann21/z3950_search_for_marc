name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Python 3.14 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14.3"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not native" --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  native-windows:
    name: Embedded YAZ and Windows package
    runs-on: windows-latest
    needs: quality
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14.3"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra package
      - shell: pwsh
        run: ./scripts/build_yaz.ps1
      - run: uv run pytest -m native
      - shell: pwsh
        run: ./scripts/package_windows.ps1
      - shell: pwsh
        run: ./scripts/test_msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Z3950MarcSearch-2.0.0-Windows-x64
          path: |
            dist/Z3950MarcSearch-2.0.0-x64.msi
            dist/SHA256SUMS.txt
            dist/main.dist/**
          if-no-files-found: error
